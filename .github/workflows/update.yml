name: Auto Update TVBox Configs

# on 字段加引号，避免被当作布尔值解析
"on":
  # 每天 UTC 02:00 和 14:00（北京时间 10:00 / 22:00）自动更新
  schedule:
    - cron: "0 2,14 * * *"
  # 支持页面手动触发
  workflow_dispatch:
  # 修改配置或脚本后 push 触发（只监听这些路径，避免自动提交 output/ 死循环）
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update.py
        env:
          REPO: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有内容变化，跳过提交"
          else
            git commit -m "chore: 自动更新影视仓配置 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            # 并发/重复触发时先 rebase 到最新，避免 non-fast-forward 导致失败
            git pull --rebase origin main || true
            git push origin main
            echo "::notice::配置已更新并推送到 main 分支"
          fi
